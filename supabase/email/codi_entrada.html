<!--
  Plantilla del correu del codi d'entrada de Falla Portal (D-021, D-045).
  On posar-la: Supabase → Authentication → Emails, **a dues plantilles amb el mateix contingut**:
    - "Magic link": l'envia a qui ja té usuari d'Auth.
    - "Confirm sign up": l'envia a qui entra per primera vegada (D-046: l'usuari es crea en demanar el primer codi). Per
      defecte porta un enllaç i **cap codi**: sense canviar-la, la primera entrada de cada membre no funciona.
  Assumpte: El teu codi d'accés a Falla Portal: {{ .Token }}
  Només porta el codi (cap enllaç): a iOS un enllaç s'obriria a Safari i no dins de l'app instal·lada.
  {{ .Token }} és el codi de 6 xifres. Caduca segons Authentication → Providers → Email → "Email OTP Expiration"
  (recomanat: 900 s = 15 minuts; si es canvia, canvia també el text de sota).

  Logo: logo-mail.png, a l'arrel del repositori (176 px d'ample, fons transparent, 19 KB, es mostra a 88 px).
  Un correu no pot dur la imatge dins: l'ha de carregar d'una adreça pública. S'usa l'adreça directa de GitHub
  (raw.githubusercontent.com, el repositori és públic) i no la del web publicat: no canvia el dia del tall (D-042) i no
  depén de GitHub Pages. Si el repositori es fa privat o canvia de nom, el logo deixa de veure's i s'ha de canviar l'adreça.
  Sense imatge (clients que la bloquegen) es veu el text "Falla Portal" i el codi segueix llegint-se.
  Enganxa a Supabase només des de <!doctype html> en avall (no el comentari).
  Estructura completa (doctype, html, head, body, title): el primer correu duia només un <div> i Outlook el va posar a brossa
  tot i l'autenticació correcta (vegeu WORKSTREAM_STATUS). [Suposició] una estructura incompleta suma punts de brossa;
  no està demostrat que siga la causa.
-->
<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>El teu codi d'accés a Falla Portal</title>
</head>
<body style="margin: 0; padding: 0; background: #ffffff;">
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #1f2937;">
  <div style="text-align: center; margin: 0 0 12px;">
    <img src="https://raw.githubusercontent.com/fallaportal/fallaportal/main/logo-mail.png" width="88" alt="Falla Portal" style="display: inline-block; width: 88px; height: auto; border: 0;">
  </div>
  <h2 style="margin: 0 0 12px; font-size: 20px; text-align: center;">Falla Portal</h2>
  <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.5;">Aquest és el teu codi per entrar:</p>
  <p style="margin: 0 0 16px; font-size: 34px; font-weight: 700; letter-spacing: 8px; text-align: center; background: #f3f4f6; border-radius: 8px; padding: 14px 0;">{{ .Token }}</p>
  <p style="margin: 0 0 8px; font-size: 14px; line-height: 1.5; color: #4b5563;">Escriu-lo a l'app. Caduca d'ací a 15 minuts i només serveix una vegada.</p>
  <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6b7280;">Si no has demanat entrar tu, ignora aquest correu: ningú no pot entrar sense el codi. No el compartisques amb ningú.</p>
</div>
</body>
</html>
